    // ==========================================

    const viewer =
        new skinview3d.SkinViewer({

            canvas: canvas,

            width: 600,

            height: 1000,

            skin: skin,

            preserveDrawingBuffer: true

        });


    // ==========================================
    // TRANSPARENT BACKGROUND
    // ==========================================

    viewer.background = null;


    if (
        viewer.renderer &&
        typeof viewer.renderer.setClearColor === "function"
    ) {

        viewer.renderer.setClearColor(
            0x000000,

        );

    }


    if (
        viewer.renderer &&
        typeof viewer.renderer.setClearAlpha === "function"
    ) {

    }


    // ==========================================
    // CONTROLS
    // ==========================================

    viewer.autoRotate = false;


    viewer.controls.enableRotate = false;

    viewer.controls.enableZoom = false;

    viewer.zoom = 0.85;

    // ==========================================

    // ==========================================

    const walking =

    walking.speed = 0.6;

    walking.headBobbing = false;


    viewer.animation = walking;



    // ==========================================
    // LIGHTING
    // ==========================================

    viewer.globalLight.intensity = 3;

    viewer.cameraLight.intensity = 0.6;


    // ==========================================
    // RESIZE
    // ==========================================

    function resize() {

        const w =
            Math.min(
                window.innerWidth * 0.9,
                345
            );


        const h =
            Math.min(
                window.innerHeight * 0.9,
                460
            );


        viewer.width =
            Math.max(
                160,
                Math.floor(w)
            );


        viewer.height =
            Math.max(
                220,
                Math.floor(h)
            );

    }


    window.addEventListener(
        "resize",
        resize
    );


    resize();


    // ==========================================
    // GIF SETTINGS
    // ==========================================
    //
    // FRAMES:
    // Number of ACTUAL frames captured.
    //
    // DURATION:
    // Total playback time of the GIF in seconds.
    //
    // FRAME_DELAY:
    // Automatically calculated from the above.
    //
    // Example:
    //
    // 60 frames
    // 5 seconds
    //
    // = 83.33ms per frame
    //
    // The GIF format stores frame delays in
    // centiseconds, so GIF.js effectively rounds
    // this to the nearest ~10ms.
    //
    // ==========================================

    const FRAMES = 150;

    const DURATION = 2;

    // Automatically calculate delay.
    const FRAME_DELAY =
        (DURATION * 1000) / FRAMES;


    // Number of frames to capture.
    const TOTAL_FRAMES = FRAMES;


    console.log(
        "GIF settings:"
    );


    console.log(
        "Frames:",
        FRAMES
    );


    console.log(
        "Duration:",
        DURATION,
        "seconds"
    );


    console.log(
        "Calculated frame delay:",
        FRAME_DELAY,
        "ms"
    );


    const WORKER_URL =
        "https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js";


    // ==========================================
    // GIF CAMERA
    //
    // These move the PLAYER inside the GIF.
    //
    // They do NOT rotate the Minecraft player.
    //
    // Positive X = right
    // Negative X = left
    //
    // Positive Y = down
    // Negative Y = up
    //
    // ==========================================

    const GIF_CAMERA_X = -43.125;

    const GIF_CAMERA_Y = -43.125;


    // ==========================================
    // GIF TRANSPARENCY
    //
    // gif.js uses a color key for transparency.
    // Use a color that is written ONLY into pixels
    // that were transparent. This prevents real black
    // pixels from being mistaken for transparency.
    //
    // ==========================================

    const TRANSPARENT_KEY = 0x010001;
    const TRANSPARENT_R = 1;
    const TRANSPARENT_G = 0;
    const TRANSPARENT_B = 1;


    // ==========================================
    // GIF WORKER
    // ==========================================

    async function createWorkerURL() {

        console.log(
            "Loading GIF encoder worker..."
        );


        const response =
            await fetch(WORKER_URL);


        if (!response.ok) {

            throw new Error(
                "Could not load GIF worker: HTTP " +
                response.status
            );

        }


        const workerCode =
            await response.text();


        const workerBlob =
            new Blob(
                [workerCode],
                {
                    type:
                        "application/javascript"
                }
            );


        return URL.createObjectURL(
            workerBlob
        );

    }


    // ==========================================
    // CAPTURE FRAME
    // ==========================================

    function captureCanvasImage() {

        return new Promise(
            function (resolve, reject) {

                try {

                    // ==================================
                    // RENDER CURRENT VIEW
                    // ==================================

                    if (
                        typeof viewer.render ===
                        "function"
                    ) {

                        viewer.render();

                    }


                    // ==================================
                    // GET CANVAS IMAGE
                    // ==================================

                    const dataURL =
                        canvas.toDataURL(
                            "image/png"
                        );


                    const image =
                        new Image();


                    image.onload =
                        function () {

                            // ==================================
                            // GIF CAMERA CANVAS
                            // ==================================

                            const gifCamera =
                                document.createElement(
                                    "canvas"
                                );


                            gifCamera.width =
                                345;


                            gifCamera.height =
                                460;


                            const ctx =
                                gifCamera.getContext(
                                    "2d",
                                    {
                                        alpha: true
                                    }
                                );


                            // ==================================
                            // COMPLETELY TRANSPARENT CANVAS
                            // ==================================

                            ctx.clearRect(
                                0,
                                0,
                                345,
                                460
                            );


                            // ==================================
                            // MOVE CAPTURED PLAYER
                            // ==================================

                            ctx.drawImage(
                                image,

                                GIF_CAMERA_X,

                                GIF_CAMERA_Y
                            );


                            // ==================================
                            // PROCESS ALPHA
                            // ==================================

                            const imageData =
                                ctx.getImageData(
                                    0,
                                    0,
                                    345,
                                    460
                                );


                            const pixels =
                                imageData.data;


                            for (
                                let i = 0;
                                i < pixels.length;
                                i += 4
                            ) {

                                const alpha =
                                    pixels[i + 3];


                                if (alpha < 128) {

                                    // Fully transparent.
                                    // IMPORTANT: do NOT use black here.
                                    // gif.js uses TRANSPARENT_KEY as the
                                    // transparent color, so real black
                                    // skin pixels stay visible.
                                    pixels[i] = TRANSPARENT_R;

                                    pixels[i + 1] = TRANSPARENT_G;

                                    pixels[i + 2] = TRANSPARENT_B;

                                    pixels[i + 3] = 255;

                                } else {

                                    // Fully opaque
                                    pixels[i + 3] = 255;

                                }

                            }


                            ctx.putImageData(
                                imageData,
                                0,
                                0
                            );


                            resolve(
                                gifCamera
                            );

                        };


                    image.onerror =
                        function () {

                            reject(
                                new Error(
                                    "Could not load captured canvas image."
                                )
                            );

                        };


                    image.src = dataURL;


                } catch (error) {

                    reject(error);

                }

            }
        );

    }


    // ==========================================
    // RECORD GIF
    // ==========================================

    async function recordGIF() {

        console.log(
            "Starting GIF recording..."
        );


        let workerURL = null;


        // ==========================================
        // CREATE WORKER
        // ==========================================

        try {

            workerURL =
                await createWorkerURL();

        } catch (error) {

            console.error(error);


            alert(
                "Could not start the GIF encoder worker.\n\n" +
                "Make sure you are connected to the internet."
            );


            return;

        }


        // ==========================================
        // CREATE GIF
        // ==========================================

        const gif =
            new GIF({

                workers: 2,

                quality: 5,

                width: 345,

                height: 460,

                repeat: 0,

                transparent: TRANSPARENT_KEY,

                workerScript:
                    workerURL

            });


        // ==========================================
        // PROGRESS
        // ==========================================

        gif.on(
            "progress",
            function (progress) {

                console.log(
                    "GIF rendering: " +
                    Math.round(
                        progress * 100
                    ) +
                    "%"
                );

            }
        );


        // ==========================================
        // FINISHED
        // ==========================================

        gif.on(
            "finished",
            function (blob) {

                console.log(
                    "GIF finished!"
                );


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const link =
                    document.createElement(
                        "a"
                    );


                link.href = url;


                link.download =
                    "minecraft_skin_walking.gif";


                document.body.appendChild(
                    link
                );


                link.click();


                document.body.removeChild(
                    link
                );


                setTimeout(
                    function () {

                        URL.revokeObjectURL(
                            url
                        );


                        if (workerURL) {

                            URL.revokeObjectURL(
                                workerURL
                            );

                        }

                    },
                    5000
                );


                console.log(
                    "Downloaded minecraft_skin_walking.gif"
                );

            }
        );


        // ==========================================
        // ABORT
        // ==========================================

        gif.on(
            "abort",
            function () {

                console.error(
                    "GIF rendering aborted."
                );


                if (workerURL) {

                    URL.revokeObjectURL(
                        workerURL
                    );

                }

            }
        );


        // ==========================================
        // ERROR
        // ==========================================

        gif.on(
            "error",
            function (error) {

                console.error(
                    "GIF error:",
                    error
                );

            }
        );


        // ==========================================
        // RECORD FRAMES
        // ==========================================

        let frame = 0;


        async function captureFrame() {

            // ==========================================
            // FINISHED CAPTURING
            // ==========================================

            if (
                frame >= TOTAL_FRAMES
            ) {

                console.log(
                    "Finished recording!"
                );


                console.log(
                    "Captured frames:",
                    TOTAL_FRAMES
                );


                console.log(
                    "GIF duration:",
                    DURATION,
                    "seconds"
                );


                console.log(
                    "Frame delay:",
                    FRAME_DELAY,
                    "ms"
                );


                console.log(
                    "Rendering GIF..."
                );


                gif.render();


                return;

            }


            // ==========================================
            // CAPTURE CURRENT FRAME
            // ==========================================

            try {

                const frameImage =
                    await captureCanvasImage();


                // ==========================================
                // ADD FRAME
                // ==========================================

                gif.addFrame(
                    frameImage,
                    {
                        copy: true,

                        delay:
                            FRAME_DELAY
                    }
                );


                // ==========================================
                // INCREMENT FRAME
                // ==========================================

                frame++;


                console.log(
                    "Recording frame " +
                    frame +
                    " / " +
                    TOTAL_FRAMES
                );


                // ==========================================
                // WAIT FOR THE FRAME DELAY
                // ==========================================

                setTimeout(
                    captureFrame,
                    FRAME_DELAY
                );


            } catch (error) {

                console.error(
                    "Frame capture failed:",
                    error
                );

            }

        }


        // ==========================================
        // START RECORDING
        // ==========================================

        setTimeout(
            function () {

                captureFrame();

            },
            1500
        );

    }


    // ==========================================
    // LOAD SKIN
    // ==========================================

    const skinFile =
        document.getElementById("skinFile");


    async function loadSelectedSkin(file) {

        if (!file) {
            return;
        }


        if (!file.type.startsWith("image/")) {

            alert(
                "Please choose an image file, such as a Minecraft PNG skin."
            );

            return;

        }


        // skinview3d only accepts Minecraft skin dimensions.
        const image = new Image();
        const imageURL = URL.createObjectURL(file);

        try {

            await new Promise(function (resolve, reject) {

                image.onload = resolve;
                image.onerror = reject;
                image.src = imageURL;

            });

            if (!(
                (image.width === 64 && image.height === 64) ||
                (image.width === 64 && image.height === 32) ||
                (image.width === 128 && image.height === 128) ||
                (image.width === 128 && image.height === 64)
            )) {

                alert(
                    "That image is " + image.width + "x" + image.height + ".\\n\\n" +
                    "Please choose a Minecraft skin PNG (64x64, 64x32, 128x128, or 128x64)."
                );

                return;

            }

        } catch (error) {

            alert("Could not read that image file.");
            return;

        } finally {

            URL.revokeObjectURL(imageURL);

        }


        const skinURL =
            URL.createObjectURL(file);


        try {

            console.log(
                "Loading selected Minecraft skin..."
            );


            await viewer.loadSkin(
                skinURL
            );


            console.log(
                "Minecraft skin loaded."
            );


            // ==========================================
            // RECORD GIF
            // ==========================================

            setTimeout(
                function () {

                    recordGIF();

                },
                1000
            );


        } catch (error) {

            console.error(
                "Could not load selected Minecraft skin:",
                error
            );


            alert(
                "Could not load that image as a Minecraft skin."
            );


        } finally {

            URL.revokeObjectURL(
                skinURL
            );

        }

    }


    if (skinFile) {

        skinFile.addEventListener(
            "change",
            function (event) {

                const file =
                    event.target.files[0];

                loadSelectedSkin(file);

            }
        );

    }


    // ==========================================
    // START WITH THE BUILT-IN SKIN
    // ==========================================

    async function start() {

        console.log(
            "Loading Minecraft skin..."
        );


        try {

            await viewer.loadSkin(
                skin
            );


            console.log(
                "Minecraft skin loaded."
            );


        } catch (error) {

            console.error(
                "Could not load Minecraft skin:",
                error
            );


            return;

        }


        // ==========================================
        // WAIT BEFORE RECORDING
        // ==========================================

        setTimeout(
            function () {

                recordGIF();

            },
            1000
        );

    }


    start();


})();

</script>
